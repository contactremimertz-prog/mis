<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIS Hélicoptères · Démo EASA</title>
<meta name="description" content="Démonstration d'un MIS conforme aux règles EASA (Part-M, Part-CAMO, Part-145, Part-21) sur une flotte d'hélicoptères fictive.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%231d4ed8%27/%3E%3Cpath d=%27M3 7h18M12 7v3M6 14a6 4 0 0 1 6-4h1a5 4 0 0 1 5 4v1H6z%27 stroke=%27white%27 stroke-width=%271.8%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot"><div class="spinner" aria-hidden="true"></div><p>Chargement de la base de démonstration…</p></div>
<div id="app" hidden>
  <div class="demo-banner" id="demo-banner"></div>
  <header class="top">
    <a class="brand" href="#dashboard">
      <span class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h20"/><path d="M12 5v4"/><path d="M5 13a7 4 0 0 1 7-4h1a5 4 0 0 1 5 4v1H5z"/><path d="M18 13h4l1-3"/><path d="M8 17v2M15 17v2M6 19h11"/></svg>
      </span>
      <span><span class="brand-name" id="brand-name"></span><span class="brand-sub" id="brand-sub"></span></span>
    </a>
    <form id="search-form" class="gsearch" role="search"><input id="gsearch" class="input" type="search" maxlength="60" autocomplete="off"></form>
    <div class="top-right">
      <span class="pill ok" id="compliance"></span>
      <div class="ctl"><label id="lang-label" for="lang"></label><select id="lang" class="input"></select></div>
      <div class="ctl"><label id="user-label" for="user"></label><select id="user" class="input"></select></div>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="nav" aria-label="Menu"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="statusbar"><span id="save-state" class="save"></span></div>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"><div id="dlg-inner"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/boot.js"></script>
</body>
</html>
