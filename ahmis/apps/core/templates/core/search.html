{% extends "base.html" %}
{% block title %}Recherche{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Recherche « {{ q }} »</h1><div class="sub">{{ results|length }} résultat(s)</div></div></div>
<div class="card"><table class="data"><thead><tr><th>Nature</th><th>Élément</th></tr></thead><tbody>
{% for kind, obj, url in results %}<tr><td>{{ kind }}</td><td><a href="{{ url }}">{{ obj }}</a></td></tr>
{% empty %}<tr><td colspan="2" class="empty">Aucun résultat.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
